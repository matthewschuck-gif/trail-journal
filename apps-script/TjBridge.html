<script>
/**
 * Connects each Trail Journal page to Apps Script (08_Web.gs).
 *  - window.tjCall_(body): the page's backend call, through google.script.run → tjCall.
 *    Replies keep the old shape ({ ok, data, error }), so the pages' own code is unchanged.
 *  - Staff on the Staff Access list, signed in with their school account (TJ_BOOT.staffAdmin) skip
 *    the shared staff password on the admin dashboard and the Trailback Panel. The per-adult
 *    check-in gate passwords inside the student journal are unchanged.
 *  - Links to other sites open in a new tab (these pages run inside Google's frame).
 */
window.tjCall_ = function (body) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (text) { try { resolve(JSON.parse(text)); } catch (e) { reject(e); } })
      .withFailureHandler(reject)
      .tjCall(JSON.stringify(body));
  });
};

document.addEventListener('DOMContentLoaded', function () {
  if (TJ_BOOT.staffAdmin) { // on the Staff Access list (21_StaffAccess.gs)
    var login = document.getElementById('login-screen');   // admin dashboard
    var shell = document.getElementById('app-shell');
    if (login && shell) {
      login.style.display = 'none';
      shell.style.display = 'block';
      try { if (typeof loadDash === 'function') loadDash(); } catch (e) { console.error(e); }
    }
    var gate = document.getElementById('pw-gate-full');    // Trailback Panel
    if (gate) gate.classList.add('hidden');
  } else if (TJ_BOOT.staffLink) {
    // trailjournal.org can't see the school account: offer the staff link (08_Web.gs staffLinkFor_).
    [['login-screen', '.login-card'], ['pw-gate-full', '.pw-gate-box']].forEach(function (p) {
      var screen = document.getElementById(p[0]), box = screen && screen.querySelector(p[1]);
      var pw = box && box.querySelector('input[data-pw]');
      if (!pw) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = pw.nextElementSibling && pw.nextElementSibling.className || '';
      btn.style.cssText = 'display:block;width:100%;margin:0 0 10px';
      btn.textContent = 'Sign in with my school account';
      btn.onclick = function () {
        var w = window.open(TJ_BOOT.staffLink, '_blank');
        if (w) { try { w.opener = null; } catch (e) {} } else { btn.textContent = 'Your browser blocked the new tab. Allow pop-ups and try again.'; }
      };
      var note = document.createElement('div');
      note.style.cssText = 'font-size:12px;opacity:.75;margin:0 0 12px';
      note.textContent = 'Opens the staff link in a new tab. Or use the staff password below.';
      try { note.style.color = getComputedStyle(box.querySelector('p') || box).color; } catch (e) {}
      pw.parentNode.insertBefore(btn, pw);
      pw.parentNode.insertBefore(note, pw);
    });
  }
});

document.addEventListener('click', function (ev) {
  var a = ev.target.closest && ev.target.closest('a[href^="http"]');
  if (a && !a.target) a.target = '_top';
}, true);
</script>
