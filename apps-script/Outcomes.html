<!DOCTYPE html>
<html lang="en">
<head>
<script>window.TJ_BOOT = <?!= boot ?>; // page, staff, siteUrl, beaconUrl, beaconToken, params (08_Web.gs)</script>
<?!= include('TjBridge'); ?>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trailback Outcomes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --trail: #243d2d; --trail-lt: #d6e8db; --ink: #1e190f; --ink-2: #4a4234; --ink-lt: #6f6250; --paper: #f6efe1; --line: #e2d8c3; --card: #faf5eb;
    --before: #c4762a; --after: #2f6fd1; --radius: 14px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Lora', Georgia, serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px 16px 70px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 30px; color: var(--trail); }
  h2 { font-family: 'Fraunces', Georgia, serif; font-size: 19px; color: var(--trail); margin: 0 0 4px; }
  .lead, .sub { color: var(--ink-lt); font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .tile .n { font-family: 'Fraunces', Georgia, serif; font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 13px; color: var(--ink-lt); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin: 14px 0; }
  .hero { display: flex; gap: 24px; align-items: baseline; flex-wrap: wrap; margin-top: 6px; }
  .hero .n { font-family: 'Fraunces', Georgia, serif; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .hero .arrow { font-size: 28px; color: var(--ink-lt); }
  .hero small { display: block; font-size: 13px; color: var(--ink-lt); font-family: 'Lora', Georgia, serif; font-weight: 400; }
  .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin: 8px 0; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .pair { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; margin: 10px 0; font-size: 14px; }
  .bars { display: flex; flex-direction: column; gap: 2px; }
  .bar { position: relative; height: 16px; display: flex; align-items: center; }
  .bar i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar span { margin-left: 8px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar.b i { background: var(--before); } .bar.a i { background: var(--after); }
  .bar:hover i { filter: brightness(1.08); }
  .na { font-size: 13px; color: var(--ink-lt); font-style: italic; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-lt); font-weight: 600; cursor: pointer; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #ece4d2; white-space: nowrap; }
  .chip.done { background: var(--trail-lt); color: var(--trail); }
  .down { color: var(--after); font-weight: 600; } .up { color: var(--before); font-weight: 600; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tip { position: fixed; pointer-events: none; background: #1e190f; color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 6px; z-index: 10; display: none; max-width: 260px; }
  .msg { padding: 14px; border-radius: 10px; background: #fceeee; color: #9e2a2a; margin-top: 14px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } .pair { grid-template-columns: 1fr; } .scroll { overflow-x: auto; } }
</style>
</head>
<body>
<main>
  <h1>Trailback outcomes</h1>
  <p class="lead" id="asof">How students who went through a Trailback Panel do the rest of the year. Counts come from the Master Log (consequences).</p>
  <div id="root"><p class="sub" style="margin-top:16px">Loading…</p></div>
</main>
<div class="tip" id="tip"></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function call(a, p) { return window.tjCall_({ action: a, payload: p || {} }).then(function (r) { if (!r.ok) throw new Error(r.error || 'Something went wrong.'); return r.data; }); }
  function tile(n, l) { return '<div class="tile"><div class="n">' + (n == null ? '–' : esc(n)) + '</div><div class="l">' + esc(l) + '</div></div>'; }
  function fmt(n) { return n == null ? '–' : String(n); }
  var legend = '<div class="legend"><span><i style="background:var(--before)"></i>Before the panel</span><span><i style="background:var(--after)"></i>After the panel</span></div>';
  function pair(label, before, after, max, unit, tipText) {
    var w = function (v) { v = Number(v); return isNaN(v) ? 0 : max ? Math.max(1, Math.round(100 * v / max)) : 1; };
    return '<div class="pair"><div>' + esc(label) + '</div><div class="bars">' +
      '<div class="bar b" data-tip="' + esc(label + ' · before: ' + before + ' ' + unit + (tipText ? ' · ' + tipText : '')) + '"><i style="width:' + w(before) + '%"></i><span>' + esc(before) + '</span></div>' +
      '<div class="bar a" data-tip="' + esc(label + ' · after: ' + after + ' ' + unit + (tipText ? ' · ' + tipText : '')) + '"><i style="width:' + w(after) + '%"></i><span>' + esc(after) + '</span></div></div></div>';
  }
  function windowsCard(o) {
    var ws = [30, 60, 90].map(function (n) { return [n, o.windows[n]]; });
    var max = Math.max.apply(null, ws.map(function (x) { return x[1] ? Math.max(x[1].before, x[1].after) : 0; }).concat([1]));
    return ws.map(function (x) {
      if (!x[1]) return '<div class="pair"><div>' + x[0] + ' days</div><div class="na">Not that long since any panel yet.</div></div>';
      return pair(x[0] + ' days · ' + x[1].noRepeat + '% no repeat', x[1].before, x[1].after, max, 'Master Log entries', x[1].students + ' students; no repeat = none of the same behavior after');
    }).join('');
  }
  // From Climb-er: every behavior source, positives, attendance and core F's, before vs since.
  function climberCard(c) {
    if (!c) return '<div class="card"><h2>From Climb-er</h2><p class="na">Climb-er writes these once a day after the hourly squad sync is on (Settings TRAILBACK_OUTCOMES in Climb-er).</p></div>';
    var rows = [['Behavior records per month', c.behaviorBefore, c.behaviorAfter, 'every Climb-er behavior source', false], ['Positives per month', c.positivesBefore, c.positivesAfter, 'shout-outs, Trait Dough and the other strengths', true],
      ['Attendance %', c.attendanceBefore, c.attendanceAfter, 'PowerSchool uploads: before the panel vs since', true], ['Core F\'s', c.coreFAtPanel, c.coreFNow, 'at the panel vs the newest upload', false]];
    return '<div class="card"><h2>From Climb-er</h2><p class="sub">Averages for ' + c.students + ' student' + (c.students === 1 ? '' : 's') + ', before the panel vs since. Up is better for positives and attendance; down is better for behavior and F\'s.</p>' + legend +
      rows.map(function (r) {
        if (r[1] == null && r[2] == null) return '<div class="pair"><div>' + esc(r[0]) + '</div><div class="na">Not enough data yet.</div></div>';
        var max = r[0] === 'Attendance %' ? 100 : Math.max(r[1] || 0, r[2] || 0, 1);
        return pair(r[0], r[1] == null ? '–' : r[1], r[2] == null ? '–' : r[2], max, '', r[3]);
      }).join('') + '</div>';
  }
  function groupTable(rows, title) {
    if (!rows.length) return '';
    return '<div class="card scroll"><h2>' + esc(title) + '</h2><table><tr><th>' + esc(title.replace('By ', '')) + '</th><th>Students</th><th>Finished plan</th><th>Per month before</th><th>Per month after</th><th>No repeat, 90 days</th></tr>' +
      rows.map(function (g) {
        var d = g.perMonthAfter != null && g.perMonthBefore != null ? (g.perMonthAfter < g.perMonthBefore ? 'down' : g.perMonthAfter > g.perMonthBefore ? 'up' : '') : '';
        return '<tr><td>' + esc(g.label) + '</td><td class="num">' + g.students + '</td><td class="num">' + g.finished + '</td><td class="num">' + fmt(g.perMonthBefore) +
          '</td><td class="num ' + d + '">' + fmt(g.perMonthAfter) + '</td><td class="num">' + (g.windows[90] ? g.windows[90].noRepeat + '%' : '–') + '</td></tr>';
      }).join('') + '</table></div>';
  }
  function climberCell(c) {
    if (!c) return '<span class="na">–</span>';
    var ba = function (x, k1, k2) { return x ? fmt(x[k1]) + ' → ' + fmt(x[k2]) : '–'; };
    return esc(ba(c.behavior, 'perMonthBefore', 'perMonthAfter') + ' / ' + ba(c.positives, 'perMonthBefore', 'perMonthAfter') + ' · ' + ba(c.attendance, 'before', 'after') + '% · ' + ba(c.coreF, 'atPanel', 'now'));
  }
  var sortKey = 'panel', sortDir = -1, D = null;
  function studentTable() {
    var list = D.students.slice().sort(function (a, b) { var x = a[sortKey], y = b[sortKey]; if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * sortDir; });
    var th = function (k, l) { return '<th data-k="' + k + '">' + l + (sortKey === k ? (sortDir < 0 ? ' ▼' : ' ▲') : '') + '</th>'; };
    return '<div class="card scroll"><h2>Each student</h2><p class="sub">Staff only. Click a column to sort.</p><table id="st"><tr>' + th('student_name', 'Student') + th('panel', 'Panel') + th('behavior_type', 'Behavior') + th('need', 'Need') +
      th('status_label', 'Outcome') + th('perMonthBefore', 'Per month before') + th('perMonthAfter', 'Per month after') + th('sameAfter', 'Same behavior after') + th('detentionsAfter', 'Detentions after') + '<th>Climb-er: behavior / positives per month · attendance · F\'s</th></tr>' +
      list.map(function (o) {
        var d = o.perMonthAfter != null ? (o.perMonthAfter < o.perMonthBefore ? 'down' : o.perMonthAfter > o.perMonthBefore ? 'up' : '') : '';
        return '<tr><td>' + esc(o.student_name || o.student_id) + (o.summit ? ' 🏔️' : '') + '</td><td>' + esc(o.panel) + '</td><td>' + esc(o.behavior_type || '–') + '</td><td>' + esc(o.need || '–') +
          '</td><td><span class="chip' + (o.status === 'closed_completed' ? ' done' : '') + '">' + esc(o.status_label) + '</span></td><td class="num">' + fmt(o.perMonthBefore) + '</td><td class="num ' + d + '">' + fmt(o.perMonthAfter) +
          '</td><td class="num">' + fmt(o.sameAfter) + '</td><td class="num">' + fmt(o.detentionsAfter) + '</td><td>' + climberCell(o.climber) + '</td></tr>';
      }).join('') + '</table></div>';
  }
  function render() {
    var p = D.pipeline, o = D.overall;
    $('asof').textContent = 'How students who went through a Trailback Panel do the rest of the year. Master Log counts, as of ' + D.asOf + '.';
    var change = o.perMonthBefore != null && o.perMonthAfter != null ? '<div class="hero"><div><span class="n" style="color:var(--before)">' + o.perMonthBefore + '</span><small>Master Log entries per month, before the panel</small></div><div class="arrow">→</div>' +
      '<div><span class="n" style="color:var(--after)">' + o.perMonthAfter + '</span><small>per month since the panel</small></div></div>' : '<p class="na">Too soon after the first panels to compare.</p>';
    $('root').innerHTML =
      '<h2 style="margin-top:18px">Results</h2><div class="tiles">' + tile(o.students, 'students through a panel') + tile(p.completed, 'finished the plan') + tile(p.detentionsCleared, 'detentions cleared') + tile(p.reverted, 'reverted') +
        tile(D.daysToFinish == null ? null : D.daysToFinish + ' d', 'panel to finished plan') + tile(D.checkinsOnTime == null ? null : D.checkinsOnTime + '%', 'check-ins on time') + tile(p.summits, 'Summits held') + '</div>' +
      '<h2>In the pipeline now</h2><div class="tiles">' + tile(p.suggested, 'suggested') + tile(p.offered, 'offered, waiting on family') + tile(p.waiting, 'consented, not yet heard') + tile(p.inRepair, 'working the plan now') + tile(p.declined, 'declined') + '</div>' +
      '<div class="card"><h2>The rest of the year</h2>' + change + '</div>' +
      climberCard(o.climber) +
      '<div class="card"><h2>The same days before and after</h2><p class="sub">Master Log entries for every student who has had that long since their panel. "No repeat" = no record of the same behavior type after.</p>' + legend + windowsCard(o) + '</div>' +
      '<div class="two">' + groupTable(D.byBehavior, 'By behavior type') + groupTable(D.byNeed, 'By need') + '</div>' +
      (D.students.length ? studentTable() : '<div class="card na">No students have been through a panel yet.</div>');
    Array.prototype.forEach.call(document.querySelectorAll('#st th[data-k]'), function (h) {
      h.onclick = function () { var k = h.getAttribute('data-k'); sortDir = sortKey === k ? -sortDir : -1; sortKey = k; render(); };
    });
  }
  document.addEventListener('mousemove', function (e) {
    var t = e.target.closest && e.target.closest('[data-tip]'), tip = $('tip');
    if (!t) { tip.style.display = 'none'; return; }
    tip.textContent = t.getAttribute('data-tip'); tip.style.display = 'block';
    tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  });
  if (!TJ_BOOT.staff) { $('root').innerHTML = '<div class="msg">Sign in with your school Google account.</div>'; return; }
  call('trailbackOutcomes').then(function (d) { D = d; render(); }).catch(function (e) { $('root').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
})();
</script>
</body>
</html>
